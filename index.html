<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f7f5" />
    <meta name="description" content="Teach a visual model with your own pictures. Images, annotations and training stay on your device." />
    <title>Local YOLO Trainer</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23161616'/%3E%3Cpath d='M12 17v-5h5m6 0h5v5m0 6v5h-5m-6 0h-5v-5' fill='none' stroke='white' stroke-width='2.4'/%3E%3C/svg%3E" />
  </head>
  <body>
    <a class="skip-link" href="#app" data-zh="跳到主要内容" data-en="Skip to content">跳到主要内容</a>
    <header class="site-header">
      <a class="brand" href="#images" aria-label="Local YOLO Trainer">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 12V5h7m8 0h7v7m0 8v7h-7m-8 0H5v-7"/></svg>
        <span><span class="brand-family">Local YOLO </span><strong>Trainer</strong><small>MINIMAL · V1</small></span>
      </a>
      <div class="header-actions">
        <button id="project-menu" class="button quiet" type="button" data-zh="项目" data-en="Project">项目</button>
        <button id="help" class="button icon-button quiet" type="button" aria-label="帮助 / Help" title="帮助 / Help">?</button>
        <button id="language-toggle" class="button compact quiet" type="button" aria-label="切换语言 / Change language">EN</button>
        <button id="theme-toggle" class="button icon-button quiet" type="button" aria-label="切换外观 / Change appearance" title="外观跟随系统 / System appearance">◐</button>
      </div>
    </header>
    <nav id="step-nav" class="step-nav" aria-label="训练步骤 / Training steps">
      <button type="button" data-step="images" aria-current="step"><span class="step-number">1</span><span data-zh="上传图片" data-en="Pictures">上传图片</span></button>
      <button type="button" data-step="annotate"><span class="step-number">2</span><span data-zh="框选物体" data-en="Mark objects">框选物体</span></button>
      <button type="button" data-step="train"><span class="step-number">3</span><span data-zh="开始学习" data-en="Teach model">开始学习</span></button>
      <button type="button" data-step="test"><span class="step-number">4</span><span data-zh="测试与保存" data-en="Test & save">测试与保存</span></button>
    </nav>
    <main id="app" tabindex="-1" aria-live="off"></main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript><p class="notice">请启用 JavaScript。图片和训练数据保留在此设备。 / Enable JavaScript. Your pictures and training stay on this device.</p></noscript>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
